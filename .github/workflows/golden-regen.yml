name: Golden regen

# Task 191: канал регенерации голденов. Текстовые/DS-правки экранов меняют
# пиксели — локально Flutter SDK нет, пересъём делается здесь (workflow_dispatch).
# Пин движка СОВПАДАЕТ с build.yml (3.47.8) — иначе тихий дрейф рендера
# (Task 176). Коммит с [skip ci] не будит релизную цепочку.

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: golden-regen
  cancel-in-progress: false

jobs:
  regen:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter (тот же пин, что в build.yml)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          channel: stable
          cache: true

      - name: Download pub deps
        run: flutter pub get

      - name: Precache SDK fonts
        run: flutter precache --universal

      - name: Regenerate goldens
        run: flutter test --update-goldens

      - name: Commit and push new goldens
        run: |
          git config user.name "goldens-bot"
          git config user.email "actions@users.noreply.github.com"
          git add test/golden/
          git diff --cached --quiet && echo "Нет изменений голденов" && exit 0
          git commit -m "chore: regen goldens [skip ci]"
          git push
