org.gradle.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=160m
org.gradle.parallel=false
org.gradle.workers.max=1
kotlin.compiler.execution.strategy=in-process
android.useAndroidX=true
android.newDsl=false
android.builtInKotlin=false
# Локальный JDK (если в системе только JRE — Temurin в ~/jdk и этот путь).
# В CI (GitHub Actions) это игнорируется — JDK подхватывается через JAVA_HOME
# от actions/setup-java. Чтобы локально не зависеть от системы,
# вынесите свой путь в ~/.gradle/gradle.properties:
#   org.gradle.java.home=/home/z/jdk
# org.gradle.java.home=/home/z/jdk
